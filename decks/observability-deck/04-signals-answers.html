<script>

const bbx = e => e.dataset.b.split(',').map(Number);
const all = OBS.region(0,0,720,405);
const tt = OBS.T(120,25,460,100); 
setTimeout(() => { const a = tt.find(t => /signals/.test(t.textContent)), b = tt.find(t => /answers/.test(t.textContent)); if (a && b) { b.style.left = (a.offsetLeft + a.offsetWidth + 10) + 'px'; b.style.top = a.style.top; } }, 600);
OBS.show(tt, {fx:'down', at:.2, dur:.8});
OBS.show(OBS.I(585,-6,810,100), {fx:'left', at:.5});
// six tiles: [x0,y0,x1,y1] of screenshot + its caption
const tiles = [[68,78,252,208],[271,78,456,208],[470,78,653,214],[68,241,251,357],[271,241,457,357],[476,241,650,357]];
tiles.forEach((t, i) => {
  const els = all.filter(e => { const b = bbx(e), cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2; return cx>=t[0]-4 && cx<=t[2]+4 && cy>=t[1]-4 && cy<=t[3]+30 && !(e.classList.contains('t')); });
  const cap = OBS.T(t[0]-6, t[3]-4, t[2]+6, t[3]+30);
  OBS.show(els, {fx:'up', dur:.7, at:.9 + i*.45}); OBS.show(cap, {fx:'fade', at:1.2 + i*.45});
});
OBS.show(OBS.I(0,0,720,405).filter(e => bbx(e)[0] > 640 && bbx(e)[1] > 375), {fx:'fade', at:4});
// afterwards each tile gets a turn: it lifts and the rest dim
OBS.later(() => {
  const groups = tiles.map(t => all.filter(e => { const b = bbx(e), cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2; return cx>=t[0]-4 && cx<=t[2]+4 && cy>=t[1]-4 && cy<=t[3]+30 && e.tagName === 'IMG'; }));
  let k = 0; setInterval(() => { groups.forEach((g, i) => g.forEach(e => { e.style.transition = 'transform .6s cubic-bezier(.2,.7,.2,1), filter .6s'; e.style.transform = i === k ? 'scale(1.06)' : 'none'; e.style.filter = i === k ? 'none' : 'brightness(.82)'; })); k = (k + 1) % 6; }, 1700);
}, 6000);
