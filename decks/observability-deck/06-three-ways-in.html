<script>

const svg = OBS.svg(), bbx = e => e.dataset.b.split(',').map(Number);
OBS.show(OBS.T(240,15,470,48), {fx:'down', at:.1});
const box = OBS.Pa(196,58,517,173).filter(p => p.getAttribute('fill') === '#153385');
OBS.show(box, {fx:'pop', at:.5, dur:.7}); OBS.show([OBS.img(285), ...OBS.T(315,66,425,84)], {fx:'fade', at:.9});
OBS.show(OBS.Pa(213,89,496,108), {fx:'grow', at:1.1, dur:.6}); OBS.show(OBS.T(325,92,380,106), {fx:'fade', at:1.4});
OBS.Pa(213,110,496,162).forEach((c, i) => OBS.show(c, {fx:'pop', at:1.5 + i*.1, dur:.4}));
OBS.T(222,114,462,158).forEach((t, i) => OBS.show(t, {fx:'fade', at:1.6 + Math.floor(i/1)*.05}));
// three wires draw from the box down to each experience
const wires = OBS.strokes(OBS.Pa(0,170,720,350));
OBS.draw(wires, {at:2.1, dur:1.1, stagger:.15});
// each experience arrives with its caption, left to right
[[[6,210,235,350],[60,352,170,382],2.9],[[238,192,475,350],[300,356,400,386],3.5],[[479,210,716,442],[545,356,645,376],4.1]].forEach(([w, c, at]) => {
  OBS.show(OBS.region(w[0], w[1], w[2], w[3]).filter(e => !e.classList.contains('t') && e.tagName !== 'path'), {fx:'up', dur:.8, at});
  OBS.show(OBS.T(c[0], c[1], c[2], c[3]), {fx:'fade', at:at + .4}); });
// packets run down each wire, one after another
OBS.later(() => { wires.forEach((w, i) => OBS.travel(svg, w.getAttribute('d'), {r:3.6, fill:'#F04E98', dur:2.2, delay:i*.8, count:1})); }, 4600);
// the experiences take turns to lift
OBS.later(() => { const gs = [OBS.img(286), OBS.img(287), OBS.img(288)]; let k = 0;
  setInterval(() => { gs.forEach((g, i) => { g.style.transition = 'transform .6s cubic-bezier(.2,.7,.2,1), filter .6s'; g.style.transform = i === k ? 'scale(1.045)' : 'none'; g.style.filter = i === k ? 'drop-shadow(0 10px 18px rgba(16,28,63,.3))' : 'none'; }); k = (k+1) % 3; }, 1900); }, 6500);
OBS.show(OBS.I(650,378,712,400), {fx:'fade', at:5});
