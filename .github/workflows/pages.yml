name: Deploy decks to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install (fslides once at the root; postinstall syncs kits and logos into every deck)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Build every deck and assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          for d in decks/*/; do
            name=$(basename "$d")
            node tools/build-player.js "$d"
            rsync -a --exclude source "$d" "_site/$name/"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - id: deployment
        uses: actions/deploy-pages@v5
